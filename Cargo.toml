[workspace]
members = ["kernel/config", "kernel/db", "kernel/core", "apps/presence", "apps/transcription", "apps/decisions", "apps/llm", "apps/tts", "apps/reminders-plugin", "bootstrap"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
gennie-config = { path = "kernel/config" }
gennie-db = { path = "kernel/db" }
gennie-core = { path = "kernel/core" }
gennie-presence = { path = "apps/presence" }
gennie-transcription = { path = "apps/transcription" }
gennie-decisions = { path = "apps/decisions" }
gennie-llm = { path = "apps/llm" }
gennie-tts = { path = "apps/tts" }
gennie-reminders-plugin = { path = "apps/reminders-plugin" }
cpal = { version = "=0.16.0", default-features = false }
handy-keys = "=0.3.4"
transcribe-cpp = { version = "=0.3.1", default-features = false, features = ["metal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
pulldown-cmark = { version = "=0.13.4", default-features = false }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.11.0", default-features = false }
dotenvy = "=0.15.7"

objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
flutter_rust_bridge = "=2.13.0"

# Evita dylibs de proc-macros con LINKEDIT desalineado en Rust 1.95/macOS 27.
# Solo afecta herramientas de compilación, no cambia la optimización del producto.
[profile.release.build-override]
strip = false
