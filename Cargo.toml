[workspace]
members = ["kernel/config", "kernel/db", "kernel/core", "apps/presence", "bootstrap"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
soc-config = { path = "kernel/config" }
soc-db = { path = "kernel/db" }
soc-core = { path = "kernel/core" }
soc-presence = { path = "apps/presence" }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-18", "accessibility", "unstable-winit-030"] }
slint-build = "=1.18.1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "=0.11.0", default-features = false }
dotenvy = "=0.15.7"

objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSEvent"] }
